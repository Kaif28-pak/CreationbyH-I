<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Content Manager — Creations by H&I</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <!-- Halt automatic CMS initialization so custom media library registers first -->
  <script>
    window.CMS_MANUAL_INIT = true;
  </script>
</head>
<body>
  <!-- Cloudinary Official Upload Widget for PC and Mobile -->
  <script src="https://upload-widget.cloudinary.com/latest/global/all.js" type="text/javascript"></script>
  <!-- Decap CMS Core -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <script>
    CMS.registerPreviewStyle("preview.css");

    // Cloudinary Direct Upload Widget (Zero Sign-In Required)
    const cloudinaryUploadLib = {
      name: "cloudinary_upload",
      init: async function({ options = {}, handleInsert } = {}) {
        let uploadWidget = null;
        return {
          show: ({ allowMultiple = false } = {}) => {
            if (!window.cloudinary) {
              alert("Cloudinary upload widget is loading. Please try again in 2 seconds.");
              return;
            }
            uploadWidget = window.cloudinary.createUploadWidget(
              {
                cloudName: "djjvgubrk",
                uploadPreset: "ml_default",
                sources: ["local", "camera", "url"],
                multiple: allowMultiple,
                resourceType: "auto",
                maxFileSize: 100000000, // 100MB
                clientAllowedFormats: ["png", "jpg", "jpeg", "webp", "gif", "mp4", "mov", "webm", "m4v"],
                theme: "minimal",
                styles: {
                  palette: {
                    window: "#FFFFFF",
                    windowBorder: "#E399B6",
                    tabIcon: "#3A2B32",
                    menuIcons: "#5A616A",
                    textDark: "#000000",
                    textLight: "#FFFFFF",
                    link: "#E399B6",
                    action: "#3A2B32",
                    inactiveTabIcon: "#E399B6",
                    error: "#F44235",
                    inProgress: "#E399B6",
                    complete: "#20B832",
                    sourceBg: "#FAFAFA"
                  }
                }
              },
              (error, result) => {
                if (!error && result && result.event === "success") {
                  handleInsert(result.info.secure_url);
                  if (uploadWidget) {
                    uploadWidget.close();
                  }
                }
              }
            );
            uploadWidget.open();
          },
          hide: () => {
            if (uploadWidget) {
              uploadWidget.close();
            }
          },
          enableStandalone: () => false
        };
      }
    };

    // Register under both custom name and default name to ensure it takes precedence
    CMS.registerMediaLibrary(cloudinaryUploadLib);
    CMS.registerMediaLibrary({ ...cloudinaryUploadLib, name: "cloudinary" });

    // Initialize Decap CMS with custom media library ready
    CMS.init();
  </script>

  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.init({
        APIUrl: "https://creationbyh-i.netlify.app/.netlify/identity"
      });
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</body>
</html>
