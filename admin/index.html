<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager — Creations by H&I</title>
  
  <!-- Netlify Identity Widget for Secure Admin Login -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    // Ensure Netlify Identity targets the production auth endpoint
    if (window.netlifyIdentity) {
      window.netlifyIdentity.init({
        APIUrl: "https://creationbyh-i.netlify.app/.netlify/identity"
      });
    }
    // Prevent Decap CMS from auto-initializing with default DAM OAuth
    window.CMS_MANUAL_INIT = true;
  </script>
</head>
<body>
  <!-- Cloudinary Official Direct Upload Widget (Bypasses DAM login modal) -->
  <script src="https://upload-widget.cloudinary.com/latest/global/all.js" type="text/javascript"></script>

  <!-- Decap CMS Core -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <script>
    // Register Preview Styles
    CMS.registerPreviewStyle("preview.css");

    // Cloudinary Direct Upload Media Library (Local Gallery, Camera & Files)
    const cloudinaryDirectLib = {
      name: "cloudinary_direct",
      init: async function({ options = {}, handleInsert } = {}) {
        let uploadWidget = null;
        return {
          show: ({ allowMultiple = false } = {}) => {
            if (!window.cloudinary) {
              alert("Cloudinary upload widget is loading. Please check your internet connection.");
              return;
            }

            uploadWidget = window.cloudinary.createUploadWidget(
              {
                cloudName: "djjvgubrk",
                uploadPreset: "ml_default",
                sources: ["local", "camera", "url"],
                defaultSource: "local",
                multiple: allowMultiple,
                resourceType: "auto",
                maxFileSize: 100000000, // 100 MB max for videos
                clientAllowedFormats: ["png", "jpg", "jpeg", "webp", "gif", "mp4", "mov", "webm", "m4v"],
                theme: "minimal",
                styles: {
                  palette: {
                    window: "#FFFFFF",
                    windowBorder: "#E399B6",
                    tabIcon: "#3A2B32",
                    menuIcons: "#5A616A",
                    textDark: "#1A1A1A",
                    textLight: "#FFFFFF",
                    link: "#D87093",
                    action: "#20B832",
                    inactiveTabIcon: "#888888",
                    error: "#F44235",
                    inProgress: "#E399B6",
                    complete: "#20B832",
                    sourceBg: "#FAFAFA"
                  }
                }
              },
              (error, result) => {
                if (!error && result && result.event === "success") {
                  if (typeof handleInsert === "function") {
                    handleInsert(result.info.secure_url);
                  }
                  if (uploadWidget) {
                    uploadWidget.close();
                  }
                }
              }
            );

            uploadWidget.open();
          },
          hide: () => {
            if (uploadWidget) {
              uploadWidget.close();
            }
          },
          enableStandalone: () => false
        };
      }
    };

    // Register custom direct media library
    CMS.registerMediaLibrary(cloudinaryDirectLib);

    // Initialize Decap CMS with custom media library ready
    CMS.init();

    // Netlify Identity Session Listener
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("login", () => {
        // Refresh page once logged in to load CMS dashboard
        document.location.reload();
      });
    }
  </script>
</body>
</html>
