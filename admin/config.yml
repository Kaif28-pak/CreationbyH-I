backend:
  name: git-gateway
  branch: main

site_url: https://creationsbyhandi.shop
display_url: https://creationsbyhandi.shop

media_library:
  name: cloudinary_direct
  output_filename_only: false
  config:
    cloud_name: "djjvgubrk"
    upload_preset: "ml_default"

publish_mode: simple

collections:
  - name: "event_planner"
    label: "Event Planner"
    label_singular: "Event Item"
    folder: "data/events"
    create: true
    slug: "{{slug}}"
    extension: "json"
    format: "json"
    summary: "{{title}} — [{{category}}]"
    fields:
      - { label: "Title", name: "title", widget: "string", hint: "Event Title (e.g. Luxury Pastel Bridal Shower)" }
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - "Bridal Shower"
          - "Wedding Event"
          - "Birthday Event"
        default: "Bridal Shower"
        hint: "Select sub-category / event type"
      - { label: "Video (Primary Content)", name: "video", widget: "file", required: false, hint: "Upload video clip (MP4 / WebM). This is the primary media displayed on the card." }
      - { label: "Image (Secondary / Fallback)", name: "image", widget: "image", required: false, hint: "Upload fallback photo or video poster." }
      - { label: "Description", name: "description", widget: "text", required: false, hint: "Short description of the event styling and decor." }
      - { label: "Display Order", name: "order", widget: "number", default: 1, value_type: "int", required: false }

  - name: "products_collection"
    label: "Products We Are Offering"
    files:
      - label: "Homepage Services (7 Main Categories)"
        name: "homepage_services"
        file: "data/products.json"
        fields: &product_list_fields
          - label: "Products"
            name: "products"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Video (optional)", name: "video", widget: "file", required: false, hint: "Short MP4 clip, under ~15 seconds recommended." }
              - { label: "Featured on homepage", name: "featured", widget: "boolean", default: true }
              - { label: "Display order", name: "order", widget: "number", default: 1 }

      - label: "Flower Bouquets"
        name: "flower_bouquets"
        file: "data/flower_bouquets.json"
        fields: *product_list_fields

      - label: "Cakes & Customized Cakes"
        name: "cakes"
        file: "data/cakes.json"
        fields: *product_list_fields

      - label: "Baskets"
        name: "baskets"
        file: "data/baskets.json"
        fields: *product_list_fields

      - label: "Balloon Boxes"
        name: "balloon_boxes"
        file: "data/balloon_boxes.json"
        fields: *product_list_fields

      - label: "Crates"
        name: "crates"
        file: "data/crates.json"
        fields: *product_list_fields

      - label: "Frames"
        name: "frames"
        file: "data/frames.json"
        fields: *product_list_fields

      - label: "Customized Items"
        name: "customized_items"
        file: "data/customized_items.json"
        fields: *product_list_fields
