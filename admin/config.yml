backend:
  name: github
  repo: Kaif28-pak/CreationbyH-I
  branch: main
  base_url: https://creationsbyhandi.shop
  auth_endpoint: api/auth

site_url: https://creationsbyhandi.shop
display_url: https://creationsbyhandi.shop

media_library:
  name: cloudinary_direct
  output_filename_only: false
  config:
    cloud_name: "djjvgubrk"
    upload_preset: "ml_default"

publish_mode: simple

collections:
  - name: "event_categories"
    label: "Event Sections & Media"
    label_singular: "Event Section"
    folder: "data/events"
    create: true
    slug: "{{slug}}"
    extension: "json"
    format: "json"
    summary: "{{name}} — (Order: {{order}})"
    fields:
      - { label: "Event Section Name", name: "name", widget: "string", hint: "e.g. Bridal Shower, Wedding Event, Birthday Event, Mehndi Event" }
      - { label: "URL Slug", name: "slug", widget: "string", hint: "e.g. bridal-shower, wedding-event (used in /events/[slug])" }
      - { label: "Short Description", name: "description", widget: "text", required: false, hint: "Describe the styling, decor, and ambiance." }
      - { label: "Cover Image", name: "cover_image", widget: "image", required: false, hint: "Cover photo displayed on the /events landing page." }
      - { label: "Display Order", name: "order", widget: "number", default: 1, value_type: "int", required: false }
      - { label: "Is Active / Visible", name: "is_active", widget: "boolean", default: true }
      - label: "Media Gallery (Reels & Photos)"
        name: "media"
        widget: "list"
        required: false
        hint: "Add as many Video Reels or Photos as you want for this event section!"
        summary: "{{title}} — [{{media_type}}]"
        fields:
          - { label: "Media Item Title", name: "title", widget: "string", hint: "e.g. Full Venue Styling & Overview" }
          - { label: "Short Description (optional)", name: "description", widget: "string", required: false }
          - label: "Media Type"
            name: "media_type"
            widget: "select"
            options:
              - "video"
              - "photo"
            default: "video"
            hint: "Select whether this item is a vertical video reel or a photo"
          - { label: "Video / Photo File", name: "file_url", widget: "file", hint: "Upload MP4/MOV reel or JPG/PNG/WEBP photo via Cloudinary" }
          - { label: "Thumbnail / Poster (optional)", name: "thumbnail_url", widget: "image", required: false, hint: "Optional video poster thumbnail image" }
          - { label: "Display Order", name: "order", widget: "number", default: 1, value_type: "int", required: false }
          - { label: "Is Active", name: "is_active", widget: "boolean", default: true }

  - name: "site_settings"
    label: "Site & WhatsApp Settings"
    files:
      - label: "General Settings"
        name: "general_settings"
        file: "data/settings.json"
        fields:
          - { label: "WhatsApp Number", name: "whatsapp_number", widget: "string", default: "923282276532", hint: "International format without '+' e.g. 923282276532" }
          - { label: "WhatsApp Inquiry Message Template", name: "whatsapp_template", widget: "text", default: "Hello Creations by H&I! I am viewing your {event_name} gallery. I loved '{media_title}' and would like to inquire about booking and pricing.", hint: "Use {event_name} and {media_title} placeholders" }

  - name: "products_collection"
    label: "Products We Are Offering"
    files:
      - label: "Homepage Services (7 Main Categories)"
        name: "homepage_services"
        file: "data/products.json"
        fields: &product_list_fields
          - label: "Products"
            name: "products"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Video (optional)", name: "video", widget: "file", required: false, hint: "Short MP4 clip, under ~15 seconds recommended." }
              - { label: "Featured on homepage", name: "featured", widget: "boolean", default: true }
              - { label: "Display order", name: "order", widget: "number", default: 1 }

      - label: "Flower Bouquets"
        name: "flower_bouquets"
        file: "data/flower_bouquets.json"
        fields: *product_list_fields

      - label: "Cakes & Customized Cakes"
        name: "cakes"
        file: "data/cakes.json"
        fields: *product_list_fields

      - label: "Baskets"
        name: "baskets"
        file: "data/baskets.json"
        fields: *product_list_fields

      - label: "Balloon Boxes"
        name: "balloon_boxes"
        file: "data/balloon_boxes.json"
        fields: *product_list_fields

      - label: "Crates"
        name: "crates"
        file: "data/crates.json"
        fields: *product_list_fields

      - label: "Frames"
        name: "frames"
        file: "data/frames.json"
        fields: *product_list_fields

      - label: "Customized Items"
        name: "customized_items"
        file: "data/customized_items.json"
        fields: *product_list_fields
